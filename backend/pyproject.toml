[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nambadrive-backend"
version = "0.1.0"
description = "NambaDrive backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "boto3>=1.43,<2",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.142,<0.143",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "redis>=7,<8",
  "sqlalchemy[asyncio]>=2.1.3,<2.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "types-defusedxml>=0.7,<1",
  "boto3-stubs[s3]>=1.43,<2",
  "mypy>=1.15,<2",
  "aiosqlite>=0.22,<1",
  "pytest-cov>=7,<8",
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
