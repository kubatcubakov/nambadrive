server {
    listen 80;
    server_name _;

    client_max_body_size 500m;
    client_body_timeout 120s;
    proxy_read_timeout 180s;

    # Trusted ONLYOFFICE traffic uses the backend internal network, never this edge.
    # Identity provisioning is reachable only on a private trusted backchannel.
    location ^~ /scim/ { return 404; }

    location ^~ /api/v1/office/internal/ { return 404; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
