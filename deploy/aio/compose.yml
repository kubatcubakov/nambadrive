      context: ../common/postgres
    user: '0'
    profiles:
    - bootstrap
    cap_add:
    - CHOWN
    - FOWNER
    networks:
    - services
    volumes:
    - search_data:/bootstrap/search_data
    - master_data:/bootstrap/master_data
    - volume_data:/bootstrap/volume_data
    - filer_data:/bootstrap/filer_data
