name: nambadrive

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - app
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      NAMBADRIVE_APP_ENV: ${NAMBADRIVE_APP_ENV:-development}
      NAMBADRIVE_PUBLIC_URL: ${NAMBADRIVE_PUBLIC_URL:-http://localhost:8080}
      NAMBADRIVE_DATABASE_URL: ${NAMBADRIVE_DATABASE_URL}
      NAMBADRIVE_REDIS_URL: ${NAMBADRIVE_REDIS_URL:-redis://redis:6379/0}
      NAMBADRIVE_AUDIT_LOG_PATH: ${NAMBADRIVE_AUDIT_LOG_PATH:-/var/log/nambadrive/audit.json}
      NAMBADRIVE_CSRF_SECRET: ${NAMBADRIVE_CSRF_SECRET}
      NAMBADRIVE_OIDC_ISSUER: ${NAMBADRIVE_OIDC_ISSUER}
      NAMBADRIVE_OIDC_DISCOVERY_URL: ${NAMBADRIVE_OIDC_DISCOVERY_URL}
      NAMBADRIVE_OIDC_CLIENT_ID: ${NAMBADRIVE_OIDC_CLIENT_ID}
      NAMBADRIVE_OIDC_CLIENT_SECRET: ${NAMBADRIVE_OIDC_CLIENT_SECRET}
      NAMBADRIVE_OIDC_ALLOWED_ALGORITHMS: ${NAMBADRIVE_OIDC_ALLOWED_ALGORITHMS:-["RS256"]}
      NAMBADRIVE_OIDC_TRANSACTION_TTL_SECONDS: ${NAMBADRIVE_OIDC_TRANSACTION_TTL_SECONDS:-600}
      NAMBADRIVE_OIDC_CLOCK_SKEW_SECONDS: ${NAMBADRIVE_OIDC_CLOCK_SKEW_SECONDS:-60}
      NAMBADRIVE_COOKIE_SECURE: ${NAMBADRIVE_COOKIE_SECURE:-false}
      NAMBADRIVE_SESSION_TTL_SECONDS: ${NAMBADRIVE_SESSION_TTL_SECONDS:-28800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - audit_logs:/var/log/nambadrive
    networks:
      - app
      - data
      - egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nambadrive}
      POSTGRES_USER: ${POSTGRES_USER:-nambadrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nambadrive} -d ${POSTGRES_DB:-nambadrive}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  egress:

volumes:
  postgres_data:
  audit_logs:
