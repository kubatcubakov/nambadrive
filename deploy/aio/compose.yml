    - -ip.bind=0.0.0.0
    - -ip=s3
    - -port=8333
    - -filer=filer:8888
    - -port.iceberg=0
    - -port.lance=0
    - -iam=false
    - -config=/run/secrets/s3.json
  s3-gateway:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101
    - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101
    - /var/run:rw,noexec,nosuid,uid=101,gid=101
    mem_limit: 1g
    build:
      context: ../common/gateway
    user: '101'
    ports: []
    networks:
