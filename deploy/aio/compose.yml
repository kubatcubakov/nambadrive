    - app.lifecycle.worker
  redis:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 256m
    build:
      context: ../common/redis
    user: '999'
    networks:
    - cache
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    - --protected-mode
    - 'no'
  clamav:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: false
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 3g
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    networks:
    - av
    - egress
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    volumes:
    - ../aio/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    - clamav_definitions:/var/lib/clamav
  tika:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    build:
      context: ../common/tika
    user: '10001'
    networks:
    - parser
    cpus: 2
  onlyoffice:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: false
    pids_limit: 1024
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 6g
    build:
      context: ../common/office
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - NET_BIND_SERVICE
    networks:
      app:
        ipv4_address: 172.29.0.20
    cpus: 4
    environment:
      JWT_ENABLED: 'true'
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'false'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      NODE_EXTRA_CA_CERTS: /tls/ca-bundle.crt
    volumes:
