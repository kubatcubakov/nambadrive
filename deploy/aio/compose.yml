# Same application/schema in every profile. Private host bindings require firewall/WireGuard preflight.
name: nambadrive-aio-all
services:
  nginx:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101
    - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101
    - /var/run:rw,noexec,nosuid,uid=101,gid=101
    mem_limit: 1g
    build:
      context: ../common/gateway
    user: '101'
    ports:
    - ${PUBLIC_IP:?}:80:8080
    - ${PUBLIC_IP:?}:443:8443
    networks:
      app:
        ipv4_address: 172.29.0.2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:?}
      SCIM_DOMAIN: ${SCIM_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      AUTHENTIK_CIDR: ${AUTHENTIK_CIDR:?}
      APP_PRIVATE_ADDRESS: ${APP_PRIVATE_ADDRESS:?}
      OFFICE_CIDR: ${OFFICE_CIDR:?}
      BACKCHANNEL_DOMAIN: ${BACKCHANNEL_DOMAIN:?}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|OFFICE_DOMAIN|SCIM_DOMAIN|S3_DOMAIN|AUTHENTIK_CIDR|OFFICE_CIDR|BACKCHANNEL_DOMAIN|APP_PRIVATE_ADDRESS)$
    volumes:
    - ../common/nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
    - ../common/nginx/office.conf.template:/etc/nginx/templates/office.conf.template:ro
    - ../common/nginx/proxy-private.conf:/etc/nginx/proxy-private.conf:ro
    - ${TLS_DIR:?}:/tls:ro
  scim-gateway:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101
    - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101
    - /var/run:rw,noexec,nosuid,uid=101,gid=101
    mem_limit: 1g
    build:
      context: ../common/gateway
    user: '101'
    ports:
    - ${PRIVATE_IP:?}:9443:9443
    networks:
      app:
        ipv4_address: 172.29.0.4
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:?}
      SCIM_DOMAIN: ${SCIM_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      AUTHENTIK_CIDR: ${AUTHENTIK_CIDR:?}
      APP_PRIVATE_ADDRESS: ${APP_PRIVATE_ADDRESS:?}
      OFFICE_CIDR: ${OFFICE_CIDR:?}
      BACKCHANNEL_DOMAIN: ${BACKCHANNEL_DOMAIN:?}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|OFFICE_DOMAIN|SCIM_DOMAIN|S3_DOMAIN|AUTHENTIK_CIDR|OFFICE_CIDR|BACKCHANNEL_DOMAIN|APP_PRIVATE_ADDRESS)$
    volumes:
    - ../common/nginx/scim.conf.template:/etc/nginx/templates/scim.conf.template:ro
    - ../common/nginx/proxy-private.conf:/etc/nginx/proxy-private.conf:ro
    - ${TLS_DIR:?}:/tls:ro
  office-backchannel:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101
    - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101
    - /var/run:rw,noexec,nosuid,uid=101,gid=101
    mem_limit: 1g
    build:
      context: ../common/gateway
    user: '101'
    ports:
    - ${PRIVATE_IP:?}:8444:8444
    networks:
      app:
        aliases:
        - ${BACKCHANNEL_DOMAIN:?}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:?}
      SCIM_DOMAIN: ${SCIM_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      AUTHENTIK_CIDR: ${AUTHENTIK_CIDR:?}
      APP_PRIVATE_ADDRESS: ${APP_PRIVATE_ADDRESS:?}
      OFFICE_CIDR: ${OFFICE_CIDR:?}
      BACKCHANNEL_DOMAIN: ${BACKCHANNEL_DOMAIN:?}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|OFFICE_DOMAIN|SCIM_DOMAIN|S3_DOMAIN|AUTHENTIK_CIDR|OFFICE_CIDR|BACKCHANNEL_DOMAIN|APP_PRIVATE_ADDRESS)$
    volumes:
    - ../common/nginx/office-backchannel.conf.template:/etc/nginx/templates/office-backchannel.conf.template:ro
    - ../common/nginx/proxy-private.conf:/etc/nginx/proxy-private.conf:ro
    - ${TLS_DIR:?}:/tls:ro
  frontend:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 128m
    build:
      context: ../../frontend
    user: '101'
    networks:
    - app
  backend:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    build:
      context: ../../backend
    user: '10001'
    networks:
    - app
    - services
    - cache
    - egress
    environment:
      NAMBADRIVE_APP_ENV: production
      NAMBADRIVE_COOKIE_SECURE: 'true'
      NAMBADRIVE_PUBLIC_URL: https://${APP_DOMAIN:?}
      NAMBADRIVE_SECRETS_DIR: /run/nambadrive-settings
      NAMBADRIVE_OIDC_ISSUER: ${OIDC_ISSUER:?}
      NAMBADRIVE_OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?}
      NAMBADRIVE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      NAMBADRIVE_S3_ENDPOINT: https://${S3_DOMAIN:?}:8333
      NAMBADRIVE_OPENSEARCH_URL: https://${SEARCH_HOST:?}:9200
      NAMBADRIVE_OPENSEARCH_CA_FILE: /tls/ca.crt
      NAMBADRIVE_OPENSEARCH_USERNAME: ${SEARCH_USERNAME:?}
      NAMBADRIVE_REDIS_URL: redis://redis:6379/0
      NAMBADRIVE_OFFICE_PUBLIC_URL: https://${OFFICE_DOMAIN:?}
      NAMBADRIVE_OFFICE_INTERNAL_URL: ${OFFICE_INTERNAL_URL:?}
      NAMBADRIVE_HTTP_CA_FILE: /tls/ca-bundle.crt
      NAMBADRIVE_OFFICE_BACKEND_URL: ${OFFICE_BACKEND_URL:?}
      NAMBADRIVE_CLAMAV_HOST: clamav
      NAMBADRIVE_TIKA_URL: http://tika:9998
      NAMBADRIVE_AUDIT_LOG_PATH: /var/log/nambadrive/audit.json
      SSL_CERT_FILE: /tls/ca-bundle.crt
      AWS_CA_BUNDLE: /tls/ca-bundle.crt
      PGSSLROOTCERT: /tls/ca.crt
    volumes:
    - ${SETTINGS_DIR:?}:/run/nambadrive-settings:ro
    - ${AUDIT_DIR:?}:/var/log/nambadrive
    - ${TRUST_DIR:?}:/tls:ro
    cpus: 2
  scan-worker:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
