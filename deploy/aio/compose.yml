      && chmod 700 /bootstrap/master_data && test -z "$(find /bootstrap/volume_data
      -mindepth 1 -print -quit)" && chown 10001:10001 /bootstrap/volume_data && chmod
      700 /bootstrap/volume_data && test -z "$(find /bootstrap/filer_data -mindepth
      1 -print -quit)" && chown 10001:10001 /bootstrap/filer_data && chmod 700 /bootstrap/filer_data
