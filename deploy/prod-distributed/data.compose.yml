# Same application/schema in every profile. Private host bindings require firewall/WireGuard preflight.
name: nambadrive-prod-distributed-data
services:
  postgres:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: false
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 8g
    build:
      context: ../common/postgres
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    networks:
    - services
    - egress
    environment:
      POSTGRES_DB: nambadrive
      POSTGRES_USER: nambadrive
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ${DATABASE_PASSWORD_FILE:?}:/run/secrets/database_password:ro
    - ${DB_TLS_DIR:?}:/tls:ro
    - ${INDEPENDENT_WAL_DIR:?}:/independent-wal
    - ../common/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    - ../common/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
    - postgres
    - -c
    - config_file=/etc/postgresql/postgresql.conf
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf
    ports:
    - ${PRIVATE_IP:?}:5432:5432
  opensearch:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: false
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 6g
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    user: '1000'
    networks:
    - services
    cpus: 2
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
    - search_data:/usr/share/opensearch/data
    - ${OPENSEARCH_CONFIG_FILE:?}:/usr/share/opensearch/config/opensearch.yml:ro
    - ${SEARCH_TLS_DIR:?}:/usr/share/opensearch/config/tls:ro
    - ${SEARCH_SECURITY_DIR:?}:/usr/share/opensearch/config/opensearch-security:ro
    ports:
    - ${PRIVATE_IP:?}:9200:9200
  master03:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '10001'
    networks:
    - services
    - egress
    cpus: 2
    volumes:
    - ${WEED_SECURITY_FILE:?}:/etc/seaweedfs/security.toml:ro
    - ${WEED_TLS_DIR:?}:/tls:ro
    - master03_data:/data
    ports:
    - ${PRIVATE_IP:?}:9333:9333
    - ${PRIVATE_IP:?}:19333:19333
    command:
    - master
    - -ip.bind=0.0.0.0
    - -mdir=/data
    - -ip=${PRIVATE_IP:?}
    - -port=9333
    - -port.grpc=19333
    - -peers=${MASTER_PEERS:?}
    - -telemetry=false
    - -defaultReplication=001
  volume-bootstrap:
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 1g
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: '0'
    profiles:
    - bootstrap
    cap_add:
    - CHOWN
    - FOWNER
    networks:
    - services
    volumes:
    - search_data:/bootstrap/search_data
    - master03_data:/bootstrap/master03_data
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - test -z "$(find /bootstrap/search_data -mindepth 1 -print -quit)" && chown 1000:1000
      /bootstrap/search_data && chmod 700 /bootstrap/search_data && test -z "$(find
      /bootstrap/master03_data -mindepth 1 -print -quit)" && chown 10001:10001 /bootstrap/master03_data
      && chmod 700 /bootstrap/master03_data
networks:
  app:
    internal: true
    ipam:
      config:
      - subnet: 172.29.0.0/24
  services:
    internal: true
  cache:
    internal: true
  av:
    internal: true
  parser:
    internal: true
  egress: {}
volumes:
  postgres_data: {}
  search_data: {}
  master03_data: {}
