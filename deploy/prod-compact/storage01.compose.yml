# Same application/schema in every profile. Private host bindings require firewall/WireGuard preflight.
name: nambadrive-prod-compact-storage01
services:
  master01:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '10001'
    networks:
    - services
    - egress
    cpus: 2
    volumes:
    - ${WEED_SECURITY_FILE:?}:/etc/seaweedfs/security.toml:ro
    - ${WEED_TLS_DIR:?}:/tls:ro
    - master01_data:/data
    ports:
    - ${PRIVATE_IP:?}:9333:9333
    - ${PRIVATE_IP:?}:19333:19333
    command:
    - master
    - -ip.bind=0.0.0.0
    - -mdir=/data
    - -ip=${PRIVATE_IP:?}
    - -port=9333
    - -port.grpc=19333
    - -peers=${MASTER_PEERS:?}
    - -telemetry=false
    - -defaultReplication=001
  volume01:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '10001'
    networks:
    - services
    - egress
    cpus: 2
    volumes:
    - ${WEED_SECURITY_FILE:?}:/etc/seaweedfs/security.toml:ro
    - ${WEED_TLS_DIR:?}:/tls:ro
    - volume01_data:/data
    ports:
    - ${PRIVATE_IP:?}:8080:8080
    - ${PRIVATE_IP:?}:18080:18080
    command:
    - volume
    - -ip.bind=0.0.0.0
    - -dir=/data
    - -ip=${PRIVATE_IP:?}
    - -port=8080
    - -port.grpc=18080
    - -master=${MASTER_PEERS:?}
    - -max=200
  filer:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '10001'
    networks:
    - services
    - egress
    cpus: 2
    volumes:
    - ${WEED_SECURITY_FILE:?}:/etc/seaweedfs/security.toml:ro
    - ${WEED_TLS_DIR:?}:/tls:ro
    - filer_data:/data
    - ../common/seaweed/filer.toml:/etc/seaweedfs/filer.toml:ro
    ports:
    - ${PRIVATE_IP:?}:8888:8888
    - ${PRIVATE_IP:?}:18888:18888
    command:
    - filer
    - -ip.bind=0.0.0.0
    - -ip=${PRIVATE_IP:?}
    - -port=8888
    - -port.grpc=18888
    - -master=${MASTER_PEERS:?}
  s3:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 2g
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    user: '10001'
    networks:
    - services
    - egress
    cpus: 2
    volumes:
    - ${WEED_SECURITY_FILE:?}:/etc/seaweedfs/security.toml:ro
    - ${WEED_TLS_DIR:?}:/tls:ro
    - ${S3_CONFIG_FILE:?}:/run/secrets/s3.json:ro
    command:
    - s3
    - -ip.bind=0.0.0.0
    - -ip=s3
    - -port=8333
    - -filer=filer:8888
    - -port.iceberg=0
    - -port.lance=0
    - -iam=false
    - -config=/run/secrets/s3.json
  s3-gateway:
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /etc/nginx/conf.d:rw,noexec,nosuid,uid=101,gid=101
    - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101
    - /var/run:rw,noexec,nosuid,uid=101,gid=101
    mem_limit: 1g
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: '101'
    ports:
    - ${PRIVATE_IP:?}:8333:8333
    networks:
    - services
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      OFFICE_DOMAIN: ${OFFICE_DOMAIN:?}
      SCIM_DOMAIN: ${SCIM_DOMAIN:?}
      S3_DOMAIN: ${S3_DOMAIN:?}
      AUTHENTIK_CIDR: ${AUTHENTIK_CIDR:?}
      APP_PRIVATE_ADDRESS: ${APP_PRIVATE_ADDRESS:?}
      OFFICE_CIDR: ${OFFICE_CIDR:?}
      BACKCHANNEL_DOMAIN: ${BACKCHANNEL_DOMAIN:?}
      NGINX_ENVSUBST_FILTER: ^(APP_DOMAIN|OFFICE_DOMAIN|SCIM_DOMAIN|S3_DOMAIN|AUTHENTIK_CIDR|OFFICE_CIDR|BACKCHANNEL_DOMAIN|APP_PRIVATE_ADDRESS)$
    volumes:
    - ../common/nginx/s3.conf.template:/etc/nginx/templates/s3.conf.template:ro
    - ../common/nginx/proxy-private.conf:/etc/nginx/proxy-private.conf:ro
    - ${TLS_DIR:?}:/tls:ro
  volume-bootstrap:
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    mem_limit: 1g
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: '0'
    profiles:
    - bootstrap
    cap_add:
    - CHOWN
    - FOWNER
    networks:
    - services
    volumes:
    - master01_data:/bootstrap/master01_data
    - volume01_data:/bootstrap/volume01_data
    - filer_data:/bootstrap/filer_data
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - test -z "$(find /bootstrap/master01_data -mindepth 1 -print -quit)" && chown
      10001:10001 /bootstrap/master01_data && chmod 700 /bootstrap/master01_data &&
      test -z "$(find /bootstrap/volume01_data -mindepth 1 -print -quit)" && chown
      10001:10001 /bootstrap/volume01_data && chmod 700 /bootstrap/volume01_data &&
      test -z "$(find /bootstrap/filer_data -mindepth 1 -print -quit)" && chown 10001:10001
      /bootstrap/filer_data && chmod 700 /bootstrap/filer_data
networks:
  app:
    internal: true
    ipam:
      config:
      - subnet: 172.29.0.0/24
  services:
    internal: true
  cache:
    internal: true
  av:
    internal: true
  parser:
    internal: true
  egress: {}
volumes:
  master01_data: {}
  volume01_data: {}
  filer_data: {}
